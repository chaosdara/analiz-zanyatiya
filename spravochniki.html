  "13. Продумывать систему работы с учебником, планировать самостоятельную работу (отбор материала для иллюстрации, выбор из учебника орфограмм, правил, законов и др.).",
  "14. Планировать систему тренировочных упражнений, которые содержат не только анализ явлений, законов, но и задания творческого характера.",
  "15. Обратить внимание на развивающее обучение – развитие умственных способностей обучающихся (мышление, речь, воображение, память и др.) используя рациональные приемы учебной деятельности.",
  "16. Обратить внимание на развивающее обучение – развитие критического обучения обучающихся путем подбора соответствующих форм и методов работы.",
  "17. Этап занятия «домашнее задание» использовать для актуализации материала, необходимого для усвоения новой темы.",
  "18. При подготовке к занятию продумывать структуру занятия, формы и методы работы на занятии с учетом полученных рекомендаций.",
  "19. Выполнять требования к современному занятию в рамках внедрения ФГОС.",
  "20. При реализации рабочей программы на занятиях использовать приемы системно-деятельностного подхода.",
  "21. Продумать систему домашних заданий в рамках отдельной темы, блоков занятий с учетом реальных возможностей и индивидуальных особенностей обучающихся группы.",
  "22. При планировании занятий предусмотреть возможность межпредметной или внутрипредметной интеграции отдельных тем.",
  "23. Обратить внимание на возможность использования игровых технологий в организации образовательного процесса.",
  "24. Обратить внимание на методику организации коллективной, групповой, индивидуальной творческой деятельности.",
  "25. Разработать систему методов и приемов по предупреждению (или преодолению) неуспешности обучающихся."
 ],
 "groups": [],
 "subjects": [],
 "teachers": []
};
const DKEY = 'analiz_dicts_v1';
let D;
try { D = JSON.parse(localStorage.getItem(DKEY)); } catch(e) { D = null; }
if (!D) D = JSON.parse(JSON.stringify(DEFAULTS));
Object.keys(DEFAULTS).forEach(function(k){ if (!D[k]) D[k] = JSON.parse(JSON.stringify(DEFAULTS[k])); });

const SECTIONS = [
  { key:'form',       title:'Форма занятия',                  std:true },
  { key:'type',       title:'Тип занятия по дидактической цели', std:true },
  { key:'goals',      title:'Цель посещения занятия',          std:true },
  { key:'conclusions',title:'Выводы о занятии',                std:true },
  { key:'recs',       title:'Рекомендации преподавателю',      std:true },
  { key:'groups',     title:'Группы',                          std:false },
  { key:'subjects',   title:'Учебные дисциплины',              std:false },
  { key:'teachers',   title:'Преподаватели',                   std:false }
];

function saveDicts(){ try { localStorage.setItem(DKEY, JSON.stringify(D)); note('Сохранено ✓'); } catch(e) { note('Ошибка сохранения'); } }
function note(t){ const n = document.getElementById('note'); n.textContent = t; clearTimeout(note._t); note._t = setTimeout(function(){ n.textContent=''; }, 1500); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function render(){
  const root = document.getElementById('dict-root');
  root.innerHTML = '';
  SECTIONS.forEach(function(sec){
    const items = D[sec.key] || [];
    const secEl = document.createElement('section');
    secEl.className = 'dsec';
    secEl.dataset.sec = sec.key;
    let h = '<div class="dsec-head"><b>' + esc(sec.title) + '</b><span class="cnt">' + items.length + '</span>';
    if (sec.std) h += '<button type="button" class="mini warn" data-act="reset">↺ Стандарт</button>';
    h += '</div><input class="dsearch" placeholder="Поиск по списку...">';
    secEl.innerHTML = h;
    const box = document.createElement('div'); box.className = 'dlist';
    if (items.length === 0) {
      const em = document.createElement('div'); em.className = 'empty';
      em.textContent = 'Список пуст — добавьте пункты кнопкой «＋ Добавить»';
      box.appendChild(em);
    }
    items.forEach(function(t, i){
      const row = document.createElement('div'); row.className = 'drow';
      const s = document.createElement('span'); s.className = 'dtext'; s.textContent = t;
      const b1 = document.createElement('button'); b1.type = 'button'; b1.className = 'mini';
      b1.dataset.act = 'edit'; b1.dataset.idx = i; b1.textContent = '✎';
      const b2 = document.createElement('button'); b2.type = 'button'; b2.className = 'mini';
      b2.dataset.act = 'del'; b2.dataset.idx = i; b2.textContent = '✕';
      row.appendChild(s); row.appendChild(b1); row.appendChild(b2);
      box.appendChild(row);
    });
    const add = document.createElement('button'); add.type = 'button'; add.className = 'addbtn';
    add.dataset.act = 'add'; add.textContent = '＋ Добавить';
    box.appendChild(add);
    secEl.appendChild(box);
    root.appendChild(secEl);
  });
}

document.getElementById('dict-root').addEventListener('click', function(e){
  const btn = e.target.closest('button'); if (!btn) return;
  const sec = btn.closest('.dsec').dataset.sec;
  const act = btn.dataset.act;
  if (act === 'edit') {
    const i = +btn.dataset.idx;
    const nv = prompt('Изменить пункт:', D[sec][i]);
    if (nv !== null && nv.trim()) { D[sec][i] = nv.trim(); saveDicts(); render(); }
  } else if (act === 'del') {
    const i = +btn.dataset.idx;
    if (confirm('Удалить пункт?')) { D[sec].splice(i, 1); saveDicts(); render(); }
  } else if (act === 'add') {
    const nv = prompt('Новый пункт:');
    if (nv && nv.trim()) { D[sec].push(nv.trim()); saveDicts(); render(); }
  } else if (act === 'reset') {
    if (confirm('Вернуть стандартный список? Ваши правки в этом разделе будут удалены.')) {
      D[sec] = JSON.parse(JSON.stringify(DEFAULTS[sec])); saveDicts(); render();
    }
  }
});

document.getElementById('dict-root').addEventListener('input', function(e){
  if (!e.target.classList.contains('dsearch')) return;
  const q = e.target.value.toLowerCase();
  const box = e.target.closest('.dsec').querySelector('.dlist');
  box.querySelectorAll('.drow').forEach(function(row){
    row.style.display = row.querySelector('.dtext').textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none';
  });
});

render();

if ('serviceWorker' in navigator) { window.addEventListener('load', function(){
  navigator.serviceWorker.register('./service-worker.js').catch(function(){});
}); }
</script>
</body>
</html>
